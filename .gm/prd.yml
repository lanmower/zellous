- id: fix-local-vad-meter-silent
  subject: 'User live-diagnosed their own local mic-input VAD meter (the SDK''s VadMeter/Pa component, rendered in the voice dock when pttUiMode===''vad'', reading adapter snapshot field S.micRawLevel) stayed silent while speaking. Root-caused via direct read of the live SDK bundle (cdn.jsdelivr.net/gh/AnEntrypoint/design@main/dist/247420.js): VadMeter''s call site passes level:S.micRawLevel||0, but zellous''s nostr-adapter.js SIGNALS list never included micRawLevel and wireweave''s voice.js''s _pollActivity computed a real RMS value every 80ms purely to derive the speaking boolean, then discarded it -- no code path anywhere emitted a live level. Fixed: wireweave/src/voice.js''s _pollActivity now emits a ''local-level'' CustomEvent with a normalized 0-1 level (rms/LEVEL_METER_CEILING, clamped) alongside the existing speaking-boolean logic (does not alter existing behavior, verified via scratch-verify-vad-level.mjs). docs/js/wireweave-bridge.js listens and writes to state.micRawLevel, quantized to 1% steps with a same-value skip to avoid triggering the adapter''s full mountCommunityApp re-render effect at the full 80ms/12.5Hz poll cadence (a real re-render-cost concern, not premature optimization -- the adapter''s subscribe() wraps every SIGNALS-listed field in one shared preact-signals effect). docs/js/nostr-adapter.js maps micRawLevel into both the snapshot and the SIGNALS reactivity list. Postcondition: commit+push wireweave, advance zellous submodule pointer, commit+push zellous, deploy, then live-witness via the cdp/browser verb against the deployed app that the VAD meter bar visually moves with real mic input (or, if a live mic isn''t available in the test browser environment, verify via injected/synthetic MediaStream track data that state.micRawLevel updates in real time and the SDK''s vx-vad-fill element''s inline width style changes accordingly).'
