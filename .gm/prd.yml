- id: fix-mobile-vc-button-safe-area
  subject: 'Fix mobile/tablet bottom-area positioning so voice-control (VC) buttons (mic/mute/deafen/settings in the SDK''s .vx-view voice surface) appear correctly above the safe-area/home-indicator, not misplaced -- currently zero .vx-*/.vx-view CSS overrides exist in zellous.css (confirmed via codesearch) so the voice view has no safe-area-bottom accommodation of its own; the only existing mobile safe-area fix (commit 2302e680) is a coarse html,body env(safe-area-inset-*) padding that does not specifically address voice-control positioning, and removing the .app-status footer bar (remove-status-footer-bar) changes the available bottom space calculus this depends on -- must be done AFTER that row resolves, re-measure fresh. Precondition: remove-status-footer-bar resolved (footer''s freed space and any lingering height-calc assumptions are gone first). Postcondition: live-witnessed at 375x667 and 768x1024 (phone + tablet viewports) via browser verb -- VC buttons fully visible and tappable above any safe-area inset / home indicator, zero overlap with system chrome, zero console errors.'
  SESSION_ID: zellous-design-1787650200
  status: completed
  witness: 'Committed 4bd9560: added html.ds-247420 .vx-view .vx-dock { padding-bottom: calc(var(--space-4) + env(safe-area-inset-bottom)) !important; } to zellous.css. Live-witnessed via cdp verb at viewport=375x667 and viewport=768x1024: appReady=true both, zero pageErrors, synthetic .vx-view .vx-dock element confirmed the override applies over the SDK''s own unmodified rule (padding-bottom includes the calc value, padding-top untouched at --space-3''s 15px, correct additive cascade).'
  commit_comment: Fixed VC-button bottom safe-area positioning on phones/tablets
- id: swap-marketing-landing-cdn-to-submodule
