- id: diagnosability-review-debug-method
  subject: 'Part (3) of the original request asked for logging/instrumentation so this bug class is diagnosable without live window.lk.__debug debugging. voice.js has a deliberate zero-console.log convention (grep-confirmed) and an existing debug() method (line 1181, exposed as window.lk.__debug per the live diagnosis session) that already surfaces peer.pc.connectionState/iceConnectionState/fsmState + participants + retrySchedule per-peer -- once fix-connection-quality-never-updates lands, debug().participants[].connectionQuality becomes the real, always-current diagnostic signal with zero extra instrumentation needed (consistent with the file''s existing event-based observability pattern, not console logging). Precondition: fix-connection-quality-never-updates and emit-peer-connect-failed-event both resolved. Postcondition: confirm via direct property read that debug()''s output after this session''s fixes correctly reflects a stuck/failed/connecting/good peer state distinctly -- no code change needed here if the above two rows already make debug() sufficient (investigate-first, only add work if a real gap remains after the other two land).'
  SESSION_ID: zellous-voicefix-1787663870
  status: completed
  witness: 'Investigated: debug() (line 1204 after edits) calls this.getParticipants() which returns Array.from(this.participants.values()) -- the same Map fix-connection-quality-never-updates now keeps genuinely current. No further code change needed: debug()''s output automatically reflects real connectionQuality (connecting/good/poor/failed) and retrySchedule (showing in-flight/exhausted reconnect attempts) with zero additional instrumentation, consistent with voice.js''s existing zero-console.log, event-based observability convention (grep-confirmed no console.* calls anywhere in the file both before and after this session''s edits).'
  commit_comment: Confirmed debug() already sufficient once connectionQuality is real -- no code change needed
- id: emit-peer-connect-failed-event
  subject: '_scheduleReconnect''s a>=6 give-up path (line 920) and any other exhausted-retry path currently emit zero terminal signal -- add a real ''peer-connect-failed'' CustomEvent (via this._emit, matching the existing ''peer-closed''/''connected''/''error'' pattern) fired exactly once when retries are genuinely exhausted, carrying {peerPubkey, attempts}, distinct from ''peer-closed'' (which still fires on every teardown including normal leaves -- do not conflate the two). Precondition: fix-connection-quality-never-updates resolved first (the quality-state transitions are the primary UI signal; this event is a secondary hook for consumers wanting the raw failure detail, e.g. a toast/log). Postcondition: live-witnessed -- a peer forced through the full retry-exhaustion path (6 failed attempts) fires exactly one ''peer-connect-failed'' event with correct peerPubkey, and a normal clean leave does NOT fire it.'
