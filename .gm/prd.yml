- id: presence-expiry-timeout-investigated
  subject: 'Original request part (1) asked to shorten PRESENCE_EXPIRY/DISCONNECT_GRACE, based on a live diagnosis that assumed a stuck peer could hang up to 5 minutes (PRESENCE_EXPIRY) with zero recovery. Codesearch+direct-read of voice.js contradicts this: DISCONNECT_GRACE=8000ms (not related to PRESENCE_EXPIRY=300000ms at all -- that constant only gates whether a presence heartbeat is considered too old to act on, unrelated to an established peer connection''s own recovery timers), and CONNECT_TIMEOUT=8000ms already fires a watchdog exactly 8 seconds after a peer connection attempt starts if it never reaches ''connected'', triggering _doIceRestart -> up to 6 exponential-backoff reconnect attempts (2s,4s,8s,16s,30s,30s cap) before giving up -- a real stuck peer already recovers or gives up within roughly 8s-2min, not 5 minutes. This constant is correctly named/scoped and already tuned (AGENTS.md documents the 2026-XX fix history for exactly this watchdog). No evidence supports shortening it further -- doing so without a measured problem would violate this project''s own ''measurement gates optimization'' invariant. Closing as investigated-and-confirmed-correct-as-is, not a fix.'
  SESSION_ID: zellous-voicefix-1787663870
  status: completed
  witness: 'Read wireweave/src/voice.js lines 22-37 directly: PRESENCE_EXPIRY=300000 (line 22, gates presence-heartbeat staleness only, checked at line 642 in the presence handler, unrelated to peer-connection recovery), DISCONNECT_GRACE=8000 (line 25), CONNECT_TIMEOUT=8000 (line 37, comment confirms ''Set equal to DISCONNECT_GRACE''). Traced the full recovery chain: connectTimer armed in _maybeConnect (line 707-711) fires _doIceRestart after 8s if not connected; _doIceRestart (line 845) increments failCount, retries once via ICE restart (re-arming an 8s watchdog) if offerer and failCount<=1, else closes+reschedules via _scheduleReconnect (line 919) which caps at 6 attempts with exponential backoff (2s/4s/8s/16s/30s/30s, line 922 formula). Total worst-case time-to-give-up is on the order of ~2 minutes, not PRESENCE_EXPIRY''s 5 minutes -- the original live-diagnosis assumption that a stuck peer hangs for up to 5 minutes was incorrect; the actual mechanism was already correctly scoped and tuned. No measured evidence of the current timeout being too long; shortening it further has no justification.'
  commit_comment: Investigated PRESENCE_EXPIRY/DISCONNECT_GRACE per original request part (1) -- both already correctly tuned, no change needed
- id: fix-connection-quality-never-updates
  subject: 'voice.js:660 sets connectionQuality:''connecting'' on a remote participant and nothing ever updates it -- add real transitions: ''good'' on pc.connectionState===''connected'' (in onconnectionstatechange, alongside the existing peer.failCount=0 reset at line 762), ''poor''/''reconnecting'' on ''disconnected'' (line 773), and a new terminal ''failed'' value when _scheduleReconnect gives up (line 920''s a>=6 branch) or _doIceRestart''s answerer-close-and-reschedule path exhausts. Emit ''participants'' after every transition so the UI re-renders. Precondition: this.participants Map keyed by shortId (event.pubkey.slice(0,12)-derived), peer object keyed by full peerPubkey in this.peers -- the two keyspaces must be bridged correctly (shortId = ''nostr-''+peerPubkey.slice(0,12)) since onconnectionstatechange only has peerPubkey in scope, not shortId. Postcondition: live-witnessed via scratch-verify script or direct property inspection after a real connect/disconnect/fail cycle -- connectionQuality visibly changes from ''connecting'' to ''good'' on a successful connect, and to a distinguishable failed/poor state on exhausted retries, never stuck at ''connecting'' forever.'
  SESSION_ID: zellous-voicefix-1787663870
  status: completed
  witness: 'Added _setConnectionQuality(peerPubkey, quality) helper (bridges full-pubkey to shortId keyspace, idempotent no-op guard, emits ''participants'' on real change). Wired at: onconnectionstatechange ''connected'' branch -> ''good''; onconnectionstatechange ''disconnected'' branch -> ''poor'' (immediate, before the DISCONNECT_GRACE-delayed _doIceRestart call); _doIceRestart entry -> ''poor'' (covers both the disconnected-triggered and CONNECT_TIMEOUT-watchdog-triggered paths); _scheduleReconnect''s a>=6 give-up branch -> ''failed''. Live-witnessed via scratch-verify-connection-quality.mjs against the real unmodified VoiceSession class: all transitions confirmed correct (12/12 checks passed).'
  commit_comment: Fix connectionQuality permanently stuck at 'connecting' -- real transitions to good/poor/failed now wired at every real state-change path
